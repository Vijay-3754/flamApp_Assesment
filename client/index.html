<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-Time Collaborative Drawing Canvas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Collaborative Canvas</h1>
      <p class="sub">Draw together in real time. Open in another tab or device to see sync.</p>
      <p id="connection-status" class="connection-status" aria-live="polite">Connecting…</p>
    </header>

    <aside class="sidebar">
      <h6>Online</h6>
      <div id="user-list" class="user-list"></div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="tool-group">
          <span class="label">Tools</span>
          <button type="button" class="btn btn-sm tool-btn active" data-tool="pencil" title="Brush">Brush</button>
          <button type="button" class="btn btn-sm tool-btn" data-tool="eraser" title="Eraser">Eraser</button>
          <button type="button" class="btn btn-sm tool-btn" data-tool="rect">Rect</button>
          <button type="button" class="btn btn-sm tool-btn" data-tool="line">Line</button>
          <button type="button" class="btn btn-sm tool-btn" data-tool="circle">Circle</button>
          <button type="button" class="btn btn-sm tool-btn" data-tool="ellipse">Ellipse</button>
          <button type="button" class="btn btn-sm tool-btn" data-tool="text">Text</button>
        </div>
        <div class="tool-group">
          <span class="label">Color</span>
          <input type="color" id="colour-picker" value="#000000" class="colour-input" title="Stroke color">
        </div>
        <div class="tool-group">
          <label for="line-width" class="label">Width</label>
          <select id="line-width" class="form-select form-select-sm">
            <option value="2">2</option>
            <option value="4" selected>4</option>
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="10">10</option>
            <option value="12">12</option>
            <option value="16">16</option>
            <option value="20">20</option>
          </select>
        </div>
        <div class="tool-group">
          <button type="button" class="btn btn-sm btn-outline-secondary" id="undo-btn" title="Undo">Undo</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" id="redo-btn" title="Redo">Redo</button>
          <button type="button" class="btn btn-sm btn-outline-danger" id="clear-btn" title="Clear">Clear</button>
        </div>
        <div class="tool-group text-tools">
          <label for="font-family" class="label">Font</label>
          <select id="font-family" class="form-select form-select-sm">
            <option value="Arial">Arial</option>
            <option value="Verdana" selected>Verdana</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Courier New">Courier New</option>
            <option value="sans-serif">sans-serif</option>
          </select>
          <label for="font-size" class="label">Size</label>
          <select id="font-size" class="form-select form-select-sm">
            <option value="14">14</option>
            <option value="16">16</option>
            <option value="18">18</option>
            <option value="20">20</option>
            <option value="24" selected>24</option>
            <option value="28">28</option>
            <option value="32">32</option>
          </select>
        </div>
      </div>

      <div id="container" class="canvas-wrap">
        <canvas id="imageView" width="1000" height="500">
          Your browser does not support canvas. Use Chrome, Firefox, or Safari.
        </canvas>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>
  <script src="websocket.js"></script>
  <script src="main.js"></script>
</body>
</html>
